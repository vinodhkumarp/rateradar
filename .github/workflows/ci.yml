name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov=rateradar --cov-report=term-missing

  migrations:
    # Migrations must apply cleanly to an empty database, and twice in a row.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rateradar
          POSTGRES_PASSWORD: rateradar
          POSTGRES_DB: rateradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RATERADAR_DATABASE_URL: postgresql://rateradar:rateradar@localhost:5432/rateradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: rateradar migrate
      - run: rateradar migrate   # idempotency is a requirement, so it is tested

name: Collect

on:
#  schedule:
#    # Twice a day, off the hour to avoid the stampede. Rates rarely move more
#    # than once a day, so a higher frequency buys precision nobody needs and
#    # spends someone else's capacity to get it (see docs/data-use.md).
#    - cron: "17 8,20 * * *"    # 18:17 and 06:17 Sydney time
#    - cron: "23 4 * * 1"       # weekly discovery refresh (Mondays)
  workflow_dispatch:
    inputs:
      brand:
        description: "Collect a single brand id (optional)"
        required: false

concurrency:
  group: collect              # never let two runs write at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RATERADAR_DATABASE_URL: ${{ secrets.RATERADAR_DATABASE_URL }}
      RATERADAR_USER_AGENT: ${{ vars.RATERADAR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Apply migrations
        run: rateradar migrate

      - name: Refresh brand registry (weekly)
        if: github.event.schedule == '23 4 * * 1'
        run: rateradar discover --apply

      - name: Health check before
        run: rateradar health

      - name: Collect
        run: rateradar collect --trigger schedule ${{ inputs.brand && format('--brand {0}', inputs.brand) || '' }}

      # Strict here: this is where a real problem should fail the run and notify.
      - name: Health check after
        run: rateradar health --strict

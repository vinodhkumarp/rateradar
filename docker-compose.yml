# Local development only. Production storage is managed Postgres (ADR-0002).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rateradar
      POSTGRES_PASSWORD: rateradar
      POSTGRES_DB: rateradar
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reads the collector's own database directly. The run ledger is already
  # structured; turning it into log lines first would only lose the structure.
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  grafana:

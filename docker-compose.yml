# Local development only. Production storage is managed Postgres (ADR-0002).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rateradar
      POSTGRES_PASSWORD: rateradar
      POSTGRES_DB: rateradar
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateradar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
